<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>CAT HUNT 0.2</title><link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body>
<header><strong>🐈 CAT HUNT <small>v0.2</small></strong><span id="roomLabel">ONLINE · SALAS PRIVADAS</span></header>
